<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Меню — Caffee'issimo</title>
  <link rel="icon" href="Assets/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --red: #AB0B0B; }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: #1a1a1a;
      overscroll-behavior: none;
    }

    /* ── Top bar ── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: #fff; border-bottom: 1px solid #e8e8e8;
      display: flex; align-items: center;
      padding: env(safe-area-inset-top, 0) 16px 0;
      height: calc(52px + env(safe-area-inset-top, 0));
      gap: 8px;
    }

    .topbar-back {
      display: flex; align-items: center; gap: 4px;
      font-size: 14px; font-weight: 700;
      color: var(--red); text-decoration: none;
      padding: 10px 8px 10px 0; white-space: nowrap; flex-shrink: 0;
    }
    .topbar-back svg {
      width: 20px; height: 20px; flex-shrink: 0;
      fill: none; stroke: var(--red); stroke-width: 2.2;
      stroke-linecap: round; stroke-linejoin: round;
    }

    .topbar-title {
      flex: 1; text-align: center; font-size: 15px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .topbar-right { width: 72px; flex-shrink: 0; } /* balance */

    /* ── Scroll area ── */
    #viewer {
      position: fixed;
      top: calc(52px + env(safe-area-inset-top, 0));
      bottom: 0; left: 0; right: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: #1a1a1a;
    }

    /* ── Page images ── */
    .menu-page {
      display: block;
      width: 100%;
      height: auto;
      /* Show skeleton while loading */
      background: #2a2a2a;
    }

    .menu-page.loaded { background: none; }

    /* gap between pages */
    .menu-page + .menu-page { margin-top: 4px; }

    /* ── Page counter badge ── */
    #counter {
      position: fixed;
      bottom: calc(14px + env(safe-area-inset-bottom, 0));
      left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      color: #fff; font-size: 12px; font-weight: 600;
      padding: 5px 14px; border-radius: 20px;
      pointer-events: none; white-space: nowrap;
      opacity: 0; transition: opacity 0.2s;
    }
    #counter.on { opacity: 1; }

    /* ── Error ── */
    #error-box {
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; padding: 80px 24px; text-align: center;
      min-height: 300px; color: #888;
    }
    #error-box svg { width: 44px; height: 44px; fill: #555; }
    #error-box p { font-size: 14px; }
    #error-box a {
      display: inline-block; background: var(--red); color: #fff;
      font-size: 14px; font-weight: 700;
      padding: 12px 28px; border-radius: 50px;
      text-decoration: none;
    }
  </style>
</head>
<body>

<header class="topbar">
  <a class="topbar-back" href="taplink.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Назад
  </a>
  <span class="topbar-title" id="page-title">Меню</span>
  <span class="topbar-right"></span>
</header>

<div id="viewer"></div>
<div id="counter"></div>

<script>
  /* ── Config ──────────────────────────────────────────── */
  const params  = new URLSearchParams(location.search);
  const type    = params.get('type') || 'main';
  const configs = {
    main: {
      title:  'Основное меню',
      dir:    'Assets/menu-main',
      pages:  61,
    },
    breakfast: {
      title:  'Меню завтраков',
      dir:    'Assets/menu-breakfast',
      pages:  4,
    },
  };
  const cfg = configs[type] || configs.main;

  document.title = cfg.title + ' — Caffee\'issimo';
  document.getElementById('page-title').textContent = cfg.title;

  /* ── Build image list ────────────────────────────────── */
  const viewer  = document.getElementById('viewer');
  const counter = document.getElementById('counter');
  const imgs    = [];

  for (let i = 0; i < cfg.pages; i++) {
    const src = `${cfg.dir}/page-${String(i).padStart(2, '0')}.jpg`;
    const img = document.createElement('img');
    img.className   = 'menu-page';
    img.src         = src;
    img.alt         = `Страница ${i + 1}`;
    img.decoding    = 'async';
    /* First 2 pages load eagerly; rest are lazy */
    img.loading     = i < 2 ? 'eager' : 'lazy';
    img.dataset.page = i + 1;
    img.addEventListener('load', () => img.classList.add('loaded'));
    viewer.appendChild(img);
    imgs.push(img);
  }

  /* ── Page counter on scroll ──────────────────────────── */
  let counterTimer = null;
  const io = new IntersectionObserver(entries => {
    /* Find the most-visible page */
    let best = null, bestRatio = 0;
    entries.forEach(e => {
      if (e.intersectionRatio > bestRatio) { bestRatio = e.intersectionRatio; best = e.target; }
    });
    if (best) {
      counter.textContent = `${best.dataset.page} / ${cfg.pages}`;
      counter.classList.add('on');
      clearTimeout(counterTimer);
      counterTimer = setTimeout(() => counter.classList.remove('on'), 1800);
    }
  }, { root: viewer, threshold: [0.3, 0.6, 1.0] });

  imgs.forEach(img => io.observe(img));

  /* Show counter on initial load */
  counter.textContent = `1 / ${cfg.pages}`;
  counter.classList.add('on');
  setTimeout(() => counter.classList.remove('on'), 2000);
</script>

</body>
</html>
